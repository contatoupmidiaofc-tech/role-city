# Publica o jogo na HostGator a cada push na main. A conta FTP aponta direto para public_html/role-city.
# Precisa de 3 segredos no GitHub: FTP_SERVER, FTP_USERNAME e FTP_PASSWORD.
# Enquanto eles não existirem, o deploy é pulado sem falhar.
name: Deploy HostGator

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - name: Aviso de segredos ausentes
        if: env.FTP_SERVER == ''
        run: echo "::notice::Deploy pulado. Cadastre FTP_SERVER, FTP_USERNAME e FTP_PASSWORD em Settings > Secrets and variables > Actions."

      - name: Enviar arquivos por FTP
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            package.json
            _redirects
